name: Test CI

on: [pull_request]

jobs:
  test-flake:
    name: "Test flake options"
    runs-on: testing

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Check up iso-biosboot
        run: nix build .#checks.x86_64-linux.iso-biosboot --show-trace

      - name: Check up iso-efiboot
        run: nix build .#checks.x86_64-linux.iso-efiboot --show-trace

  build-iso:
    name: "Build Image"
    runs-on: testing

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Build NixOS configuration
        run: nix build
          .#nixosConfigurations.xinux.config.system.build.images.iso-installer
          --show-trace

  update-merge:
    name: "Merge Update PRs"
    needs: [test-flake, build-iso]
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'xinuxmgrbot' &&
      github.event_name == 'pull_request'}}

    steps:
      - name: Enable auto-merge for Update PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ secrets.PAT }}
